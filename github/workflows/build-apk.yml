name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o *.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          cd BADEGNAN_OS_Android_V1_4_OFFLINE_READY
          chmod +x gradlew || true
          if [ ! -x gradlew ]; then gradle wrapper --gradle-version 8.9; chmod +x gradlew; fi
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: badegnan-os-debug-apk
          path: BADEGNAN_OS_Android_V1_4_OFFLINE_READY/app/build/outputs/apk/debug/*.apk
